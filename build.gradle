plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.golifeanddeath.GoMain'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation files('/opt/gradle-8.14.3/lib/junit-4.13.2.jar')
    testImplementation files('/opt/gradle-8.14.3/lib/hamcrest-core-1.3.jar')
}

jar {
    manifest {
        attributes 'Main-Class': 'com.golifeanddeath.GoMain'
    }
}
